<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusConnect - Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="container">
    <div class="page-head">
      <h1 id="greeting">Campus issues</h1>
      <p class="muted">Everything students have reported, newest first.</p>
    </div>

    <div class="stats">
      <div class="stat s-open"><div class="num" id="count-open">0</div><div class="label">Open</div></div>
      <div class="stat s-progress"><div class="num" id="count-progress">0</div><div class="label">In Progress</div></div>
      <div class="stat s-resolved"><div class="num" id="count-resolved">0</div><div class="label">Resolved</div></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <select id="filter-status" aria-label="Filter by status"><option value="">All statuses</option></select>
        <select id="filter-category" aria-label="Filter by category"><option value="">All categories</option></select>
        <span class="spacer"></span>
        <a class="btn" href="/create.html">Report an issue</a>
      </div>
      <div id="issue-list"></div>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    requireLogin();
    renderNavbar("dashboard.html");

    const statusSelect = document.getElementById("filter-status");
    const categorySelect = document.getElementById("filter-category");
    const list = document.getElementById("issue-list");

    api("/me").then((u) => {
      document.getElementById("greeting").textContent = "Hi " + u.name.split(" ")[0] + ", here's the campus board";
    });

    async function loadFilters() {
      const meta = await api("/categories");
      meta.statuses.forEach((s) => statusSelect.add(new Option(s, s)));
      meta.categories.forEach((c) => categorySelect.add(new Option(c, c)));
    }

    async function loadIssues() {
      const params = new URLSearchParams();
      if (statusSelect.value) params.set("status", statusSelect.value);
      if (categorySelect.value) params.set("category", categorySelect.value);

      try {
        const data = await api("/issues?" + params.toString());
        document.getElementById("count-open").textContent = data.summary["Open"];
        document.getElementById("count-progress").textContent = data.summary["In Progress"];
        document.getElementById("count-resolved").textContent = data.summary["Resolved"];

        if (data.issues.length === 0) {
          list.innerHTML = '<div class="empty"><strong>No issues here yet</strong>Change the filters, or report the first one.</div>';
          return;
        }
        list.innerHTML = data.issues
          .map(
            (i) => `
          <a class="issue-item st-${statusClass(i.status)}" href="/issue.html?id=${i.id}">
            <div class="issue-row">
              <span class="title">${esc(i.title)}</span>
              ${statusBadge(i.status)}
            </div>
            <div class="meta">
              ${categoryTag(i.category)}
              <span>${esc(i.author)}</span>
              <span>${formatDate(i.created_at)}</span>
            </div>
          </a>`
          )
          .join("");
      } catch (err) {
        list.innerHTML = `<div class="empty"><strong>Couldn't load issues</strong>${esc(err.message)}</div>`;
      }
    }

    statusSelect.addEventListener("change", loadIssues);
    categorySelect.addEventListener("change", loadIssues);
    loadFilters().then(loadIssues);
  </script>
</body>
</html>
