<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report an Issue | CampusConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="container" style="max-width:720px">
    <div class="page-head">
      <h1>Report an Issue</h1>
      <p class="muted">
        Spotted a problem on campus? Share the details so it can be resolved.
      </p>
    </div>

    <section class="card">
      <form id="issue-form">
        <label for="title"> Issue Title</label>
        <input id="title" type="text" minlength="3" maxlength="100" placeholder="e.g. Projector not working in Room 204" required>

        <label for="category">Issue Category</label>
        <select id="category" required>
          <option value="">Choose a category</option>
        </select>
        
        <label for="description">Describe the problem</label>
        <textarea id="description" minlength="5" maxlength="1000" placeholder="Mention the location and explain what happened..." required></textarea>

        <p class="muted" id="character-count" aria-live="polite">
          0 / 1000 characters
        </p>

        <button class="full" id="submit-button" type="submit">
          Submit issue
        </button>
        <div
          id="message"
          class="message"
          role="alert"
          aria-live="polite"
        ></div>
      </form>  
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script>
    requireLogin();
    renderNavbar("create.html");

    const categorySelect = document.getElementById("category");
    const form = document.getElementById("issue-form");
    const description = document.getElementById("description");
    const characterCount = document.getElementById("character-count");
    const submitButton = document.getElementById("submit-button");
    const message = document.getElementById("message");

    description.addEventListener("input", () => {
      characterCount.textContent =
        `${description.value.length} / 1000 characters`;
    });
    async function loadCategories() {
      try {
        const data = await api("/categories");

        data.categories.forEach((category) => {
          categorySelect.add(new Option(category, category));
        });
      } catch (error) {
        showMessage(message, "Unable to load categories. Please refresh the page.");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage(message);

      if (!form.reportValidity()) return;

      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";
      try {
        const data = await api("/issues", {
          method: "POST",
          body: JSON.stringify({
            title: document.getElementById("title").value.trim(),
            category: categorySelect.value,
            description: description.value.trim()
          })
        });

        window.location.href =
          "/issue.html?id=" + encodeURIComponent(data.id);

      } catch (error) {
        showMessage(message, error.message);

        submitButton.disabled = false;
        submitButton.textContent = "Submit issue";
      }
    });

    loadCategories();
  </script>
</body>
</html>
