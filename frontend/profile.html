<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusConnect - Profile</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="container" style="max-width:600px">
    <div class="card" id="profile-card"><div class="empty">Loading...</div></div>
    <p style="margin-top:18px"><button type="button" class="secondary" id="logout-btn">Log out</button></p>
  </main>

  <script src="/js/app.js"></script>
  <script>
    requireLogin();
    renderNavbar("profile.html");
    document.getElementById("logout-btn").addEventListener("click", logout);

    api("/me")
      .then((u) => {
        document.getElementById("profile-card").innerHTML = `
          <div class="profile-top">
            <div class="avatar" aria-hidden="true">${esc(u.name.trim().charAt(0).toUpperCase())}</div>
            <div>
              <h1>${esc(u.name)}</h1>
              <div class="muted">${esc(u.email)}</div>
            </div>
          </div>
          <dl class="detail-meta" style="margin-bottom:0">
            <dt>Member since</dt><dd>${formatDate(u.created_at)}</dd>
            <dt>Issues reported</dt><dd>${u.issues_reported}</dd>
          </dl>`;
      })
      .catch((err) => {
        document.getElementById("profile-card").innerHTML = `<div class="empty"><strong>Couldn't load your profile</strong>${esc(err.message)}</div>`;
      });
  </script>
</body>
</html>
